<style>
.overlapped-gallery {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
    height: 400px;
    gap: 0;
    perspective: 1000px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 20px 0;
}

.gallery-item {
    position: absolute;
    width: 300px;
    height: 360px;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.gallery-item:nth-child(1) { left: 0; z-index: 6; transform: rotateY(-5deg) scale(0.95); }
.gallery-item:nth-child(2) { left: 220px; z-index: 5; transform: rotateY(0deg) scale(0.98); }
.gallery-item:nth-child(3) { left: 440px; z-index: 4; transform: rotateY(5deg) scale(0.95); }
.gallery-item:nth-child(4) { left: 660px; z-index: 3; transform: rotateY(10deg) scale(0.9); }
.gallery-item:nth-child(5) { left: 880px; z-index: 2; transform: rotateY(12deg) scale(0.88); }
.gallery-item:nth-child(6) { left: 1100px; z-index: 1; transform: rotateY(14deg) scale(0.86); }

.gallery-item:hover {
    transform: translateY(-20px) rotateY(0deg) scale(1.05) !important;
    z-index: 10;
}

@media (max-width: 1024px) {
    .gallery-item { width: 250px; height: 280px; }
    .gallery-item:nth-child(1) { left: 0; }
    .gallery-item:nth-child(2) { left: 170px; }
    .gallery-item:nth-child(3) { left: 340px; }
    .gallery-item:nth-child(4) { left: 510px; }
    .gallery-item:nth-child(5) { left: 680px; }
    .gallery-item:nth-child(6) { left: 850px; }
}

@media (max-width: 768px) {
    .overlapped-gallery { height: 280px; }
    .gallery-item { width: 200px; height: 230px; }
    .gallery-item:nth-child(1) { left: 0; }
    .gallery-item:nth-child(2) { left: 140px; }
    .gallery-item:nth-child(3) { left: 280px; }
    .gallery-item:nth-child(4) { left: 420px; }
    .gallery-item:nth-child(5) { left: 560px; }
    .gallery-item:nth-child(6) { left: 700px; }
}

@media (max-width: 480px) {
    .overlapped-gallery { 
        height: 220px;
        padding: 15px 0;
    }
    .gallery-item { 
        width: 160px; 
        height: 180px; 
    }
    .gallery-item:nth-child(1) { left: 10px; }
    .gallery-item:nth-child(2) { left: 100px; }
    .gallery-item:nth-child(3) { left: 190px; }
    .gallery-item:nth-child(4) { left: 280px; }
    .gallery-item:nth-child(5) { left: 370px; }
    .gallery-item:nth-child(6) { left: 460px; }
}
</style>
