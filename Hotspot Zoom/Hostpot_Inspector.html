					<style>
.hz-hotspot-zoom .elementor-widget-container {
  overflow: hidden;
  position: relative;
  touch-action: none;
  cursor: grab;
}

.hz-hotspot-zoom .elementor-widget-container.is-dragging {
  cursor: grabbing;
}

.hz-hotspot-zoom .e-hotspot {
  transform-origin: 0 0;
  will-change: transform;
}

.hz-hotspot-zoom .hz-zoom-controls {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hz-hotspot-zoom .hz-zoom-btn {
  border: 1px solid rgba(17, 24, 39, 0.2);
  background: rgba(255, 255, 255, 0.94);
  color: #111827;
  font-family: inherit;
  font-size: 16px;
  line-height: 1;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(17, 24, 39, 0.2);
}

.hz-hotspot-zoom .hz-zoom-in,
.hz-hotspot-zoom .hz-zoom-out {
  width: 38px;
  height: 38px;
  padding: 0;
}

.hz-hotspot-zoom .hz-zoom-reset {
  min-width: 38px;
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  line-height: 30px;
}

.hz-hotspot-zoom .hz-zoom-btn:hover {
  background: #ffffff;
}

</style>

<script>
   (function () {
  function createControlButton(label, className, onClick) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = className;
    button.textContent = label;
    button.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      onClick();
    });
    return button;
  }

  function createZoomControls(container, panzoom) {
    if (container.querySelector('.hz-zoom-controls')) return;

    var controls = document.createElement('div');
    controls.className = 'hz-zoom-controls';

    var zoomIn = createControlButton('+', 'hz-zoom-btn hz-zoom-in', function () {
      panzoom.zoomIn();
    });

    var zoomOut = createControlButton('-', 'hz-zoom-btn hz-zoom-out', function () {
      panzoom.zoomOut();
    });

    var reset = createControlButton('Reset', 'hz-zoom-btn hz-zoom-reset', function () {
      panzoom.reset();
    });

    controls.appendChild(zoomIn);
    controls.appendChild(zoomOut);
    controls.appendChild(reset);
    container.appendChild(controls);
  }

  function initHotspotZoom(scope) {
    var container = scope.querySelector('.elementor-widget-container');
    var stage = scope.querySelector('.e-hotspot');
    if (!container || !stage || stage.dataset.zoomReady === '1') return;

    stage.dataset.zoomReady = '1';

    function start() {
      var panzoom = Panzoom(stage, {
        maxScale: 4,
        minScale: 1,
        contain: 'outside',
        canvas: true
      });

      createZoomControls(container, panzoom);

      container.addEventListener(
        'wheel',
        function (e) {
          e.preventDefault();
          var delta = e.deltaY < 0 ? 1.1 : 0.9;
          panzoom.zoomWithWheel(e, { step: delta });
        },
        { passive: false }
      );

      container.addEventListener('pointerdown', function () {
        container.classList.add('is-dragging');
      });

      window.addEventListener('pointerup', function () {
        container.classList.remove('is-dragging');
      });

      container.addEventListener('dblclick', function () {
        panzoom.reset();
      });
    }

    if (window.Panzoom) {
      start();
      return;
    }

    var script = document.createElement('script');
    script.src = 'https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js';
    script.onload = start;
    document.head.appendChild(script);
  }

  function bootAll() {
    document
      .querySelectorAll('.elementor-widget-hotspot.hz-hotspot-zoom')
      .forEach(initHotspotZoom);
  }

  document.addEventListener('DOMContentLoaded', bootAll);

  if (window.jQuery && window.elementorFrontend) {
    jQuery(window).on('elementor/frontend/init', function () {
      elementorFrontend.hooks.addAction(
        'frontend/element_ready/hotspot.default',
        function ($scope) {
          initHotspotZoom($scope[0]);
        }
      );
    });
  }
})();

</script>				</div>
